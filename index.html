<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ほんとの自分が60秒でわかる！AIパーソナル無料診断</title>

    <!-- ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ -->

      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());

      // 下の 'G-67KB6C3CTR' を、あなた自身の測定IDに書き換えてください。
      gtag('config', 'G-67KB6C3CTR');

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 0.75rem; cursor: pointer; transition: background-color 0.2s; padding: 8px; border-radius: 8px; }
        .checkbox-label:hover { background-color: #f0f9ff; }
        .checkbox-label input[type="checkbox"] { margin-right: 0.75rem; width: 1.25rem; height: 1.25rem; accent-color: #3b82f6; }
        .result-box { border: 1px solid #e5e7eb; padding: 1.5rem; margin-top: 1.5rem; border-radius: 0.5rem; background-color: #f9fafb; }
        .ai-generated-content { background-color: white; padding: 1rem; border-radius: 0.375rem; border: 1px solid #d1d5db; }
        .error-message { background-color: #fff1f2; border: 1px solid #fecaca; color: #be123c; padding: 1rem; border-radius: 0.375rem; }
        .loading-spinner { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
    <div class="bg-white shadow-xl rounded-lg p-6 sm:p-10 w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-blue-600 mb-2">今のままで、本当に満足ですか？</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 mb-4">あなたが心の底から本来、手にしたいと願っていることは？</h2>
            <p class="text-gray-600">「自分の本当の力に気づき、望む未来をデザインしませんか？」<br>以下の項目にチェックを入れて、AIによるパーソナル診断を受けてみましょう。</p>
        </header>
        <form id="coachingCheckForm">
            <div class="space-y-1 mb-8">
                <h3 class="text-lg font-semibold text-gray-700 mb-3">セルフチェックリスト</h3>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">最近、仕事や日々の生活にマンネリを感じている。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">自分の強みや本当にやりたいことが何なのか、よくわからない。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">目標はあるものの、何から手をつければ良いか分からず行動に移せない。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">重要な決断を前にすると、自信が持てず迷ってしまうことが多い。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">周りの意見や評価が気になり、自分らしさを出しにくいと感じる。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">もっと自分の能力や可能性を活かしたいと強く思う。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">人間関係やコミュニケーションで悩むことがある。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">将来に対する漠然とした不安や焦りを感じることがある。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">ストレスを溜め込みやすく、うまく発散できていないと感じる。</label>
                <label class="checkbox-label"><input type="checkbox" name="checkItem">今の自分を変えたい、新しいステージに進みたいという気持ちがある。</label>
            </div>
            <button type="button" id="diagnosisButton" onclick="showResult()" class="w-full bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">AIでパーソナル診断を受ける</button>
        </form>
        <div id="resultArea" class="result-box hidden"></div>
        
        <div class="result-box mt-6">
             <h3 class="text-xl font-semibold mb-3 text-gray-800">✨ あなたの「強み」発見AIツール</h3>
             <p class="text-gray-600 mb-4">最近の出来事（仕事での成功、困難を乗り越えた経験など）を自由に入力してください。AIがあなたの隠れた強みを分析します。</p>
             <textarea id="strengthStory" class="w-full h-32 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500" placeholder="例：難しいプロジェクトで、周りと協力しながら粘り強く交渉し、なんとか合意形成にこぎつけました。"></textarea>
             <button type="button" id="findStrengthButton" onclick="findStrengths()" class="w-full mt-4 bg-purple-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-purple-600 transition-all">AIに強みを分析してもらう</button>
             <div id="strengthResultArea" class="mt-4 hidden"></div>
        </div>
    </div>
    <script>
        let checkedItemsText = [];

        async function callGemini(prompt) {
            const apiEndpoint = `${window.location.origin}/api/proxy`;
            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                if (!response.ok) {
                    let errorMsg = `サーバーでエラーが発生 (ステータス: ${response.status})。`;
                    try { const errorData = await response.json(); errorMsg += `<br>詳細: ${errorData.error}`; } catch (e) { /* ignore */ }
                    throw new Error(errorMsg);
                }
                const result = await response.json();
                if (result.text) { return result.text; }
                throw new Error("APIから予期しない形式の応答がありました。");
            } catch (error) {
                console.error("callGemini内部でエラー:", error);
                throw error;
            }
        }

        function displayError(area, error, button, buttonText) {
             area.innerHTML = `<div class="error-message"><h4 class="font-bold mb-2">エラーが発生しました</h4><p>${error.message || '不明なエラーです。'}</p><p class="text-sm mt-4"><b>【確認してください】</b><br>Vercelプロジェクトの環境変数「GEMINI_API_KEY」は正しく設定されていますか？（設定変更後は再デプロイが必要です）</p></div>`;
            if (button) { button.disabled = false; button.textContent = buttonText; }
        }

        async function showResult() {
            const resultArea = document.getElementById('resultArea');
            const diagnosisButton = document.getElementById('diagnosisButton');
            checkedItemsText = Array.from(document.querySelectorAll('input[name="checkItem"]:checked')).map(cb => cb.parentElement.textContent.trim());
            resultArea.innerHTML = '';
            resultArea.classList.remove('hidden');
            if (checkedItemsText.length === 0) {
                resultArea.innerHTML = `<h3 class="text-xl font-semibold mb-3">診断結果</h3><p>素晴らしい！今のあなたはとても充実しているようです。</p>`;
                resultArea.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            resultArea.innerHTML = `<h3 class="text-xl font-semibold mb-3">✨ AIが診断中...</h3><p class="text-gray-600 mb-4">あなたに合わせたアドバイスを生成しています。</p><div class="loading-spinner"></div>`;
            resultArea.scrollIntoView({ behavior: 'smooth' });
            diagnosisButton.disabled = true; diagnosisButton.textContent = '診断中...';
            try {
                const prompt = `あなたはプロのコーチです。ある人が自己診断で以下の項目にチェックを入れました。\n\nチェック項目:\n- ${checkedItemsText.join('\n- ')}\n\nこの結果に基づき、以下の2つのパートを含む、温かく力づけるメッセージを生成してください。\n\nパート1: まず、相手の状況に共感し、それらの課題が成長の機会であることを示唆するパーソナルメッセージを2〜3文で述べます。\nパート2: 次に、その流れで自然に、なぜ「専門家との対話（無料体験セッション）」が有効な次の一手なのか、その理由を簡潔に1〜2文で説明します。「一人で考え込むよりも、対話を通して思考を整理し、客観的な視点を得ることが現状を打破するきっかけになる」という点を強調してください。\n\nパート1とパート2の間は改行を一つ入れてください。`;
                const aiMessage = await callGemini(prompt);
                const formsLink = 'https://ws.formzu.net/fgen/S694819392/';
                resultArea.innerHTML = `
                    <h3 class="text-xl font-semibold mb-3">AIによるパーソナル診断結果</h3>
                    <div class="ai-generated-content mb-6 whitespace-pre-wrap">${aiMessage.replace(/\n/g, '<br><br>')}</div>
                    <div class="text-center">
                        <a href="${formsLink}" target="_blank" rel="noopener noreferrer" class="inline-block bg-orange-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-orange-600 transition-all transform hover:scale-105">
                            今すぐ無料で専門家と話す。
                        </a>
                    </div>
                `;
                diagnosisButton.disabled = false; diagnosisButton.textContent = '再度診断する';
            } catch (error) {
                displayError(resultArea, error, diagnosisButton, '再度診断する');
            }
        }

        async function findStrengths() {
            const strengthResultArea = document.getElementById('strengthResultArea');
            const findStrengthButton = document.getElementById('findStrengthButton');
            const story = document.getElementById('strengthStory').value;
            if (!story) { alert('分析したい出来事を入力してください。'); return; }
            strengthResultArea.classList.remove('hidden');
            strengthResultArea.innerHTML = `<h4 class="text-lg font-semibold text-gray-700 mb-3">✨ あなたの強みを分析中...</h4><div class="loading-spinner"></div>`;
            findStrengthButton.disabled = true; findStrengthButton.textContent = '分析中...';
            try {
                const prompt = `あなたはキャリアコーチの専門家です。クライアントが以下の体験談を語ってくれました。\n\n体験談：\n「${story}」\n\nこの文章を分析し、このエピソードから読み取れるクライアントの潜在的な強みを3〜5個挙げてください。各強みについて、太字のタイトル（例：**粘り強さ**）と、その強みが体験談の中でどのように発揮されたかを説明する一行の解説を付けてください。`;
                const strengths = await callGemini(prompt);
                const formsLink = 'https://ws.formzu.net/fgen/S694819392/';
                strengthResultArea.innerHTML = `
                    <h4 class="text-lg font-semibold text-gray-700 mb-3">AIが発見したあなたの強み</h4>
                    <div class="ai-generated-content whitespace-pre-wrap mb-6">${strengths}</div>
                    <p class="text-center text-gray-600 mb-4">これらの強みを活かし、さらにステップアップしませんか？</p>
                    <div class="text-center">
                        <a href="${formsLink}" target="_blank" rel="noopener noreferrer" class="inline-block bg-orange-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-orange-600 transition-all transform hover:scale-105">
                           今すぐ無料で専門家と話す。
                        </a>
                    </div>
                `;
                findStrengthButton.disabled = false; findStrengthButton.textContent = '再度、強みを分析してもらう';
            } catch (error) {
                 displayError(strengthResultArea, error, findStrengthButton, 'AIに強みを分析してもらう');
            }
        }
    </script>
</body>
</html>
